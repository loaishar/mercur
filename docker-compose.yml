services:
  postgres:
    image: postgres:16-alpine
    container_name: mercur-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mercur
    ports:
      - "5432:5432"
    volumes:
      - mercur-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mercur"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mercur-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mercur-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: mercur-meilisearch
    restart: unless-stopped
    profiles:
      - search
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
      MEILI_MASTER_KEY: mercur_meili_master_key
    ports:
      - "7700:7700"
    volumes:
      - mercur-meilisearch-data:/meili_data

volumes:
  mercur-postgres-data:
  mercur-redis-data:
  mercur-meilisearch-data:
